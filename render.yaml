services:
  # ─── BACKEND WEB SERVICE (Free Tier) ───────────────────────────────────────
  - type: web
    name: parking-backend
    runtime: node
    plan: free
    region: singapore # same AWS region as the Neon database (ap-southeast-1)
    rootDir: apps/backend
    # Applies any pending Prisma migrations to the production database on every deploy.
    buildCommand: npm install --include=dev && npm run build && npm run db:deploy
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        # Neon production branch, DIRECT connection string (pooling OFF) — Prisma
        # migrations don't work through Neon's pooler. Set it in the Render dashboard.
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OPERATOR_JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ALLOW_SIMULATED_PAYMENTS
        value: "false"
      - key: DASHBOARD_URL
        sync: false # Set to your deployed Vercel dashboard URL
      - key: DEFAULT_FEE_RATE_PER_HOUR
        value: "30"
      - key: MINIMUM_WALLET_TOPUP
        value: "35"
      - key: MAXIMUM_WALLET_TOPUP
        value: "10000"
      - key: DEBT_REPAYMENT_WINDOW_HOURS
        value: "48"
      - key: DEBT_FINE_AMOUNT
        value: "500"
      - key: STALE_SESSION_HOURS
        value: "24"
      - key: FACILITY_TIMEZONE
        value: Asia/Kolkata
